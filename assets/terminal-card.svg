<svg width="1000" height="270" viewBox="0 0 1000 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff0f5b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff0f5b" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#ff0f5b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 0H7" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="1000" height="270" rx="18" fill="#000000"/>
  <rect x="1" y="1" width="998" height="268" rx="17" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect width="1000" height="270" rx="18" fill="url(#scanlines)"/>
  <path d="M42 38H958" stroke="url(#border)" stroke-width="2" filter="url(#glow)"/>

  <circle cx="36" cy="24" r="5" fill="#ff0f5b" opacity="0.85"/>
  <circle cx="54" cy="24" r="5" fill="#a855f7" opacity="0.65"/>
  <circle cx="72" cy="24" r="5" fill="#ffffff" opacity="0.38"/>

  <text x="42" y="72" font-family="JetBrains Mono, Consolas, monospace" font-size="22" fill="#ff0f5b" font-weight="700">stoic@ls:~$</text>
  <text x="205" y="72" font-family="JetBrains Mono, Consolas, monospace" font-size="22" fill="#f8f2ff">whoami</text>
  <text x="42" y="106" font-family="JetBrains Mono, Consolas, monospace" font-size="22" fill="#f8f2ff">4Stoic</text>

  <text x="42" y="148" font-family="JetBrains Mono, Consolas, monospace" font-size="22" fill="#ff0f5b" font-weight="700">stoic@ls:~$</text>
  <text x="205" y="148" font-family="JetBrains Mono, Consolas, monospace" font-size="22" fill="#f8f2ff">mission</text>
  <text x="42" y="182" font-family="JetBrains Mono, Consolas, monospace" font-size="22" fill="#f8f2ff">build reliable systems that scale</text>

  <text x="42" y="230" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#a855f7">profile: full-stack systems / automation / operations</text>
  <rect x="597" y="216" width="10" height="20" fill="#ff0f5b">
    <animate attributeName="opacity" values="0;1;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="610" y="86" font-family="JetBrains Mono, Consolas, monospace" font-size="22" fill="#ff0f5b" font-weight="700">production stack</text>
  <text x="610" y="124" font-family="JetBrains Mono, Consolas, monospace" font-size="21" fill="#f8f2ff">typescript / python / go</text>
  <text x="610" y="157" font-family="JetBrains Mono, Consolas, monospace" font-size="21" fill="#f8f2ff">react / next.js / node.js</text>
  <text x="610" y="190" font-family="JetBrains Mono, Consolas, monospace" font-size="21" fill="#f8f2ff">postgres / redis / docker</text>
  <text x="610" y="223" font-family="JetBrains Mono, Consolas, monospace" font-size="21" fill="#f8f2ff">linux / nginx / cloudflare</text>
</svg>