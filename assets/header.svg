<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#010003"/>
      <stop offset="0.36" stop-color="#07000d"/>
      <stop offset="0.68" stop-color="#1b082c"/>
      <stop offset="1" stop-color="#040006"/>
    </linearGradient>

    <radialGradient id="bloodViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 160) rotate(90) scale(230 560)">
      <stop stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#6d28d9" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#020005" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="line" x1="145" y1="0" x2="1055" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2b0a42" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#2b0a42" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a855f7" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="deepGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#a855f7" stroke-opacity="0.045"/>
    </pattern>

    <pattern id="scanlines" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 0H7" stroke="#ffffff" stroke-opacity="0.028"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="28" fill="url(#bloodViolet)"/>
  <rect width="1200" height="340" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="28" fill="url(#scanlines)"/>

  <circle cx="235" cy="170" r="210" fill="#6d28d9" opacity="0.08" filter="url(#deepGlow)"/>
  <circle cx="965" cy="155" r="245" fill="#a855f7" opacity="0.06" filter="url(#deepGlow)"/>

  <path d="M76 272 C228 177, 336 304, 516 231 S882 212, 1128 88" stroke="#a855f7" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M88 76 C245 136, 384 36, 558 92 S853 118, 1112 48" stroke="#8b5cf6" stroke-opacity="0.13" stroke-width="2"/>

  <path d="M145 88H1055" stroke="url(#line)" stroke-width="2" filter="url(#glow)"/>
  <path d="M145 252H1055" stroke="url(#line)" stroke-width="2" filter="url(#glow)"/>

  <rect x="248" y="112" width="704" height="118" rx="18" fill="#030006" fill-opacity="0.38" stroke="#a855f7" stroke-opacity="0.16"/>

  <g id="sigil" stroke="#a855f7" stroke-width="2" filter="url(#glow)" opacity="0.86">
    <path d="M600 44L628 72L600 100L572 72L600 44Z"/>
    <path d="M600 240L628 268L600 296L572 268L600 240Z"/>
    <path d="M600 72V112M600 228V268" stroke-linecap="round"/>
    <path d="M566 170H634M600 136V204" stroke-linecap="round"/>
    <path d="M580 150L620 190M620 150L580 190" stroke-opacity="0.65"/>
    <animate attributeName="opacity" values="0.55;0.95;0.55" dur="3.2s" repeatCount="indefinite"/>
  </g>

  <g stroke="#7c3aed" stroke-width="2" opacity="0.65" filter="url(#glow)">
    <path d="M104 158L128 182L104 206L80 182L104 158Z"/>
    <path d="M1096 104L1120 128L1096 152L1072 128L1096 104Z"/>
    <path d="M104 132V232M1096 78V178" stroke-opacity="0.38"/>
    <animate attributeName="opacity" values="0.35;0.75;0.35" dur="4.1s" repeatCount="indefinite"/>
  </g>

  <g opacity="0.72">
    <path d="M318 170H382M818 170H882" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
    <path d="M337 154L362 170L337 186M863 154L838 170L863 186" stroke="#a855f7" stroke-opacity="0.46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="300" cy="170" r="4" fill="#a855f7" filter="url(#glow)"/>
    <circle cx="900" cy="170" r="4" fill="#a855f7" filter="url(#glow)"/>
  </g>

  <text x="600" y="164" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="78" font-weight="800" fill="#f8f2ff" letter-spacing="1.5">4Stoic</text>
  <text x="600" y="205" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="600" fill="#c4b5fd" letter-spacing="5">code · systems · automation</text>

  <rect x="0" y="0" width="160" height="340" fill="url(#scan)" opacity="0.1">
    <animate attributeName="x" values="-220;1260" dur="6.2s" repeatCount="indefinite"/>
  </rect>

  <line x1="0" y1="170" x2="1200" y2="170" stroke="#a855f7" stroke-opacity="0.08">
    <animate attributeName="opacity" values="0.02;0.11;0.02" dur="2.7s" repeatCount="indefinite"/>
  </line>

  <circle cx="214" cy="88" r="3" fill="#a855f7" filter="url(#glow)">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="986" cy="252" r="3" fill="#a855f7" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
