<svg width="920" height="28" viewBox="0 0 920 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="920" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff0f5b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff0f5b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff0f5b" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 0H6" stroke="#ffffff" stroke-opacity="0.02"/>
    </pattern>
  </defs>

  <rect width="920" height="28" rx="10" fill="transparent"/>
  <rect width="920" height="28" rx="10" fill="url(#scanlines)" opacity="0.4"/>

  <line x1="40" y1="14" x2="880" y2="14" stroke="url(#line)" stroke-width="2" filter="url(#glow)"/>

  <circle cx="460" cy="14" r="3.5" fill="#ff0f5b" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <rect x="485" y="8" width="8" height="12" rx="1" fill="#ff0f5b">
    <animate attributeName="opacity" values="0;1;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
