<svg width="1000" height="245" viewBox="0 0 1000 245" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff0f5b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff0f5b" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#ff0f5b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 0H7" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="1000" height="245" rx="18" fill="#000000"/>
  <rect x="1" y="1" width="998" height="243" rx="17" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect width="1000" height="245" rx="18" fill="url(#scanlines)"/>
  <path d="M42 34H958" stroke="url(#border)" stroke-width="2" filter="url(#glow)"/>

  <circle cx="36" cy="22" r="4.5" fill="#ff0f5b" opacity="0.85"/>
  <circle cx="54" cy="22" r="4.5" fill="#a855f7" opacity="0.65"/>
  <circle cx="72" cy="22" r="4.5" fill="#ffffff" opacity="0.35"/>

  <text x="42" y="66" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#ff0f5b" font-weight="700">core</text>
  <text x="42" y="98" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#f8f2ff">typescript / python / go</text>

  <text x="42" y="134" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#ff0f5b" font-weight="700">frontend</text>
  <text x="42" y="166" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#f8f2ff">react / next.js / tailwind</text>

  <text x="42" y="202" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#ff0f5b" font-weight="700">backend</text>
  <text x="42" y="226" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#f8f2ff">node.js / fastapi / workers</text>

  <text x="390" y="66" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#ff0f5b" font-weight="700">data</text>
  <text x="390" y="98" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#f8f2ff">postgres / redis / sqlite</text>

  <text x="390" y="134" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#ff0f5b" font-weight="700">infra</text>
  <text x="390" y="166" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#f8f2ff">docker / linux / nginx</text>

  <text x="390" y="202" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#ff0f5b" font-weight="700">ops</text>
  <text x="390" y="226" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#f8f2ff">ci/cd / logging / monitoring</text>

  <text x="815" y="72" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#a855f7">systems stack</text>
  <rect x="742" y="94" width="150" height="10" rx="5" fill="#181818"/>
  <rect x="742" y="94" width="118" height="10" rx="5" fill="#ff0f5b" filter="url(#glow)">
    <animate attributeName="width" values="96;126;96" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <text x="815" y="141" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#f8f2ff">apis · queues · dashboards</text>
  <text x="815" y="166" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#f8f2ff">discord · auth · payments</text>
  <text x="815" y="191" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#f8f2ff">deploys · health · uptime</text>
</svg>