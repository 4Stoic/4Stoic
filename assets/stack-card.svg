<svg width="1000" height="205" viewBox="0 0 1000 205" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff0f5b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff0f5b" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff0f5b" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 0H7" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="1000" height="205" rx="18" fill="#000000"/>
  <rect x="1" y="1" width="998" height="203" rx="17" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect width="1000" height="205" rx="18" fill="url(#scanlines)"/>

  <path d="M42 34H958" stroke="url(#border)" stroke-width="2" filter="url(#glow)"/>

  <circle cx="36" cy="22" r="4.5" fill="#ff0f5b" opacity="0.85"/>
  <circle cx="54" cy="22" r="4.5" fill="#a855f7" opacity="0.65"/>
  <circle cx="72" cy="22" r="4.5" fill="#ffffff" opacity="0.35"/>

  <text x="42" y="70" font-family="JetBrains Mono, Consolas, monospace" font-size="19" fill="#ff0f5b" font-weight="700">frontend</text>
  <text x="42" y="102" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#f8f2ff">react / vite / tailwind</text>

  <text x="42" y="138" font-family="JetBrains Mono, Consolas, monospace" font-size="19" fill="#ff0f5b" font-weight="700">backend</text>
  <text x="42" y="170" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#f8f2ff">node.js / python / sql</text>

  <text x="390" y="70" font-family="JetBrains Mono, Consolas, monospace" font-size="19" fill="#ff0f5b" font-weight="700">tools</text>
  <text x="390" y="102" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#f8f2ff">git / github / vscode / powershell</text>

  <text x="390" y="138" font-family="JetBrains Mono, Consolas, monospace" font-size="19" fill="#ff0f5b" font-weight="700">now</text>
  <text x="390" y="170" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#f8f2ff">building LS systems</text>

  <text x="805" y="70" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#a855f7">stack: ready</text>
  <rect x="760" y="92" width="90" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="760" y="92" width="68" height="10" rx="5" fill="#ff0f5b" filter="url(#glow)"/>

  <text x="805" y="138" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#f8f2ff">python · ts · js</text>
  <text x="805" y="162" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#f8f2ff">react · node · sql</text>
</svg>
