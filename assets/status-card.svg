<svg width="1000" height="150" viewBox="0 0 1000 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff0f5b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff0f5b" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff0f5b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 0H7" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="1000" height="150" rx="18" fill="#000000"/>
  <rect x="1" y="1" width="998" height="148" rx="17" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect width="1000" height="150" rx="18" fill="url(#scanlines)"/>
  <path d="M42 34H958" stroke="url(#border)" stroke-width="2" filter="url(#glow)"/>

  <circle cx="36" cy="22" r="4.5" fill="#ff0f5b" opacity="0.9"/>
  <circle cx="54" cy="22" r="4.5" fill="#a855f7" opacity="0.65"/>
  <circle cx="72" cy="22" r="4.5" fill="#ffffff" opacity="0.35"/>

  <text x="42" y="70" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#ff0f5b" font-weight="700">mode</text>
  <text x="128" y="70" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#f8f2ff">shipping</text>

  <text x="42" y="108" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#ff0f5b" font-weight="700">focus</text>
  <text x="128" y="108" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#f8f2ff">LS ecosystem</text>

  <text x="372" y="70" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#ff0f5b" font-weight="700">systems</text>
  <text x="492" y="70" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#f8f2ff">bots / dashboards / portals</text>

  <text x="372" y="108" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#ff0f5b" font-weight="700">infra</text>
  <text x="492" y="108" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#f8f2ff">vps / docker / cloudflare</text>

  <text x="820" y="70" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#a855f7">operational</text>
  <circle cx="904" cy="64" r="6" fill="#ff0f5b" filter="url(#glow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <rect x="745" y="90" width="170" height="8" rx="4" fill="#181818"/>
  <rect x="745" y="90" width="132" height="8" rx="4" fill="#ff0f5b" filter="url(#glow)">
    <animate attributeName="width" values="104;142;104" dur="3.4s" repeatCount="indefinite"/>
  </rect>
  <text x="830" y="122" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#f8f2ff">build → test → deploy</text>
</svg>