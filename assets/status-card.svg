<svg width="1000" height="140" viewBox="0 0 1000 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff0f5b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff0f5b" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff0f5b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 0H7" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="1000" height="140" rx="18" fill="#000000"/>
  <rect x="1" y="1" width="998" height="138" rx="17" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect width="1000" height="140" rx="18" fill="url(#scanlines)"/>
  <path d="M42 34H958" stroke="url(#border)" stroke-width="2" filter="url(#glow)"/>

  <circle cx="36" cy="22" r="4.5" fill="#ff0f5b" opacity="0.9"/>
  <circle cx="54" cy="22" r="4.5" fill="#a855f7" opacity="0.65"/>
  <circle cx="72" cy="22" r="4.5" fill="#ffffff" opacity="0.35"/>

  <text x="42" y="72" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#ff0f5b" font-weight="700">mode</text>
  <text x="128" y="72" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#f8f2ff">building</text>

  <text x="42" y="106" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#ff0f5b" font-weight="700">focus</text>
  <text x="128" y="106" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#f8f2ff">LS systems</text>

  <text x="400" y="72" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#ff0f5b" font-weight="700">editor</text>
  <text x="504" y="72" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#f8f2ff">VS Code</text>

  <text x="400" y="106" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#ff0f5b" font-weight="700">runtime</text>
  <text x="504" y="106" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#f8f2ff">Node / Python</text>

  <text x="795" y="72" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#a855f7">online</text>
  <circle cx="865" cy="66" r="6" fill="#ff0f5b" filter="url(#glow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <rect x="740" y="88" width="160" height="8" rx="4" fill="#181818"/>
  <rect x="740" y="88" width="112" height="8" rx="4" fill="#ff0f5b" filter="url(#glow)">
    <animate attributeName="width" values="90;130;90" dur="3.4s" repeatCount="indefinite"/>
  </rect>
</svg>
